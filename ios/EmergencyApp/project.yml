name: Farosos
options:
  bundleIdPrefix: com.farosos
  deploymentTarget:
    iOS: "16.0"
packages:
  Farosos:
    path: ..
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  EmergencyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Farosos
        product: PersonStateMachine
      - package: Farosos
        product: NetworkRoleMachine
      - package: Farosos
        product: PacketCodec
      - package: Farosos
        product: BeaconRadio
      - package: Farosos
        product: ParticipantRegistration
      - package: Farosos
        product: DeviceIdentity
      - package: FirebaseiOS
        product: FirebaseCore
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farosos.EmergencyApp
        PRODUCT_NAME: Farosos
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Farosos usa Bluetooth para difundir y recibir beacons de estado con teléfonos cercanos, sin internet ni señal celular."
