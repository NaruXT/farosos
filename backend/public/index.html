<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farosos — Panel de rescate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Farosos — Panel de rescate</h1>
      <button id="logout-button" type="button" hidden>Cerrar sesión</button>
    </header>

    <section id="login-section">
      <form id="login-form">
        <h2>Iniciar sesión</h2>
        <label>
          Email
          <input type="email" id="login-email" required autocomplete="username" />
        </label>
        <label>
          Contraseña
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <button type="submit">Entrar</button>
        <p id="login-error" role="alert" hidden></p>
      </form>
    </section>

    <main id="app-section" hidden>
      <section id="current-state-section">
        <h2>Estado actual de la malla</h2>
        <p id="current-state-empty" hidden>Todavía no hay datos de la malla.</p>
        <table id="current-state-table">
          <thead>
            <tr>
              <th>Persona</th>
              <th>Contacto</th>
              <th>Estado</th>
              <th>Ubicación</th>
              <th>Última actualización</th>
              <th>Confirmado por</th>
              <th>Verificación</th>
              <th>Rescate</th>
            </tr>
          </thead>
          <tbody id="current-state-body"></tbody>
        </table>
      </section>

      <section id="history-section" hidden>
        <button id="history-back-button" type="button">← Volver al estado actual</button>
        <h2 id="history-title">Historial</h2>
        <table id="history-table">
          <thead>
            <tr>
              <th>Secuencia</th>
              <th>Estado</th>
              <th>Ubicación</th>
              <th>Subido</th>
              <th>Verificación</th>
              <th>Rescate</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
